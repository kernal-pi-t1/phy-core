# Waypoint configuration for pick-and-place orchestration.
# All poses: [x, y, z, roll, pitch, yaw]
#   - x, y, z in meters
#   - roll, pitch, yaw in degrees
#
# Replace placeholder values with actual robot waypoints before deployment.

orchestration_node:
  ros__parameters:
    # Camera extrinsics (position & orientation in base frame)
    #   camera_offset: [x, y, z] meters from base_0
    #   camera_rpy:    [roll, pitch, yaw] degrees, camera optical frame → base frame
    camera_offset: [0.80, 0.0, 0.66]
    camera_rpy: [180.0, 0.0, 0.0]  # downward-looking: 180° roll (cam_Z → -base_Z)

    # Fixed waypoints — joint angles [j1, j2, j3, j4, j5, j6] in degrees (MoveJoint/FK)
    # get_pose로 받아오는 pick 좌표만 IK(MoveLine), 나머지는 전부 FK(MoveJoint)
    init_pose: [0.0, 0.0, 90.0, 0.0, 90.0, 0.0]
    val_pose: [0.0, -10.0, 90.0, 0.0, 90.0, 0.0]
    place_pose: [90.0, 0.0, 90.0, 0.0, 90.0, 0.0]
    place_return_pose: [-90.0, 0.0, 90.0, 0.0, 90.0, 0.0]

sam3_node:
  ros__parameters:
    device: "cuda"
    confidence_threshold: 0.0054  # best from sweep: score=108.68 (10/10 detect, 0 FP, max_std=1.32mm)
    frame_skip: 1  # 1=no skip, 5=backbone every 5th frame (~60ms effective)
    # Camera intrinsics (RealSense D435 typical values — REPLACE with actual)
    fx: 260.0
    fy: 593.0
    cx: 115.0
    cy: 443.0
