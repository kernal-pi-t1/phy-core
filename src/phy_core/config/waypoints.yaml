# Waypoint configuration for pick-and-place orchestration.
# All poses: [x, y, z, roll, pitch, yaw]
#   - x, y, z in meters
#   - roll, pitch, yaw in degrees
#
# Replace placeholder values with actual robot waypoints before deployment.

orchestration_node:
  ros__parameters:
    # Fixed waypoints (replace with actual robot poses)
    init_pose: [0.3, 0.0, 0.4, 0.0, 0.0, 0.0]
    val_pose: [0.3, 0.0, 0.5, 0.0, 90.0, 0.0]
    place_pose: [0.3, 0.3, 0.2, 0.0, 0.0, 0.0]
    place_return_pose: [0.3, -0.3, 0.2, 0.0, 0.0, 0.0]

sam3_node:
  ros__parameters:
    device: "cuda"
    confidence_threshold: 0.5
    frame_skip: 1  # 1=no skip, 5=backbone every 5th frame (~60ms effective)
    # Camera intrinsics (RealSense D435 typical values — REPLACE with actual)
    fx: 615.0
    fy: 615.0
    cx: 320.0
    cy: 240.0
